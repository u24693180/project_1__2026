<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="logo">
          <span class="logo-mark">P</span>
          <span>Pulse</span>
        </div>

        <nav class="nav">
          <a href="/" class="active">Overview</a>
          <a href="#">Services</a>
          <a href="#">Analytics</a>
          <a href="/contact">Contacts</a>
        </nav>

        <button class="btn">New Report</button>
      </header>

      <main class="main">
        <section class="service">
          <div class="service-card highlight">
            <p>Revenue</p>
            <h3>$84,260</h3>
            <span>+12.8%</span>
          </div>

          <div class="service-card">
            <p>Customers</p>
            <h3>1,284</h3>
            <span>+4.2%</span>
          </div>

          <div class="service-card">
            <p>Conversion</p>
            <h3>6.84%</h3>
            <span class="down">-1.1%</span>
          </div>
        </section>

        <section class="metrics">
          <div class="metric-panel">
            <div class="panel-head">
              <h4>Monthly Overview</h4>
              <a href="#">View</a>
            </div>
            <div class="bars">
              <span style="height: 40%"></span>
              <span style="height: 55%"></span>
              <span style="height: 48%"></span>
              <span style="height: 72%"></span>
              <span style="height: 82%"></span>
              <span style="height: 96%"></span>
            </div>
          </div>

          <div class="metric-panel">
            <div class="panel-head">
              <h4>Service Health</h4>
              <a href="#">More</a>
            </div>

            <ul class="list">
              <li>
                <div class="list-row">
                  <strong>Support</strong>
                  <span>92%</span>
                </div>
                <div class="progress"><span style="width: 92%"></span></div>
              </li>
              <li>
                <div class="list-row">
                  <strong>Marketing</strong>
                  <span>76%</span>
                </div>
                <div class="progress"><span style="width: 76%"></span></div>
              </li>
              <li>
                <div class="list-row">
                  <strong>Operations</strong>
                  <span>88%</span>
                </div>
                <div class="progress"><span style="width: 88%"></span></div>
              </li>
            </ul>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p>© 2026 Pulse Dashboard</p>
      </footer>
    </div>
  </body>
</html>
